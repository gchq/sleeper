# Application name
quarkus.application.name=sleeper-api

# HTTP
quarkus.http.port=8080

# CORS - Allow React frontend to call the API
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.access-control-max-age=24H

# Lambda
quarkus.lambda.handler=rest

# AWS S3
quarkus.s3.sync-client.type=url
quarkus.s3.devservices.enabled=false

# AWS DynamoDB
quarkus.dynamodb.sync-client.type=url
quarkus.dynamodb.devservices.enabled=false

# AWS CloudWatch
quarkus.cloudwatch.sync-client.type=url
quarkus.cloudwatch.devservices.enabled=false

# Native image optimisation
quarkus.native.resources.includes=**/*.properties

# Test-profile defaults for the Sleeper instance config @ConfigProperty values.
# Without these, any @QuarkusTest that doesn't set them via @TestProfile fails at
# startup with "Failed to load config value ... for: sleeper.instance.id". Tests
# that need real values (e.g. hitting S3/DynamoDB) override these via @TestProfile.
%test.sleeper.instance.id=test-instance
%test.sleeper.account.name=test-account
