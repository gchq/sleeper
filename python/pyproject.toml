[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper"
version = "0.37.4"
description = "Python client for Sleeper"
requires-python = ">=3.10"

dependencies = [
    "pyarrow>=25.0.1,<26.0.0",
    "boto3>=1.43.46,<2.0.0",
    "s3fs>=2026.7.0,<2027.0.0",
    "boto3-stubs[essential]>=1.43.46,<2.0.0",
    "websockets>=16.1.1,<17.0.0",
    "jproperties>=2.1.2,<3.0.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.4,<0.17.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "testcontainers[localstack]>=4.15.0,<5.0.0",
    "moto>=5.2.3,<6.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sleeper = ["py.typed"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
python_functions = "should_*"
filterwarnings = [
    "error",
    "default::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 200

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",  # Ruff-specific rules
]