name: Check code versions
on:
  pull_request:
    paths:
      - '.github/workflows/check-versions.yaml'
      - '.github/config/chunks.yaml'
      - '.github/scripts/checkVersionNumber.sh'
      - 'java/**'
      - 'python/**'
      - 'rust/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Check version numbers are set correctly
        run: .github/scripts/checkVersionNumber.sh

