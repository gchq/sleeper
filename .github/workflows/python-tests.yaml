name: Python Tests
on:
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-tests.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Python build
        run: pip install ".[dev]"
        working-directory: ./python
      - name: Python tests
        run: pytest
        working-directory: ./python
